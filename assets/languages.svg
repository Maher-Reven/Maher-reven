<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Language distribution across 25 owned repositories: TypeScript 49.5%, Rust 15.1%, JavaScript 14.2%, MDX 7.8%, Python 4.4%, PLpgSQL 3.1%, HTML 2.2%, CSS 2.1%, other 1.6%">
  <title>Language distribution across 25 owned repositories</title>
  <defs>
    <linearGradient id="lpanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <clipPath id="lclip"><rect x="0" y="0" width="1000" height="150" rx="14"/></clipPath>
    <clipPath id="barclip"><rect x="40" y="56" width="920" height="22" rx="11"/></clipPath>
    <style>
      .m { font-family: ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace; }
      .h { font-size: 12.5px; fill: #7d8590; letter-spacing: 1.4px; }
      .l { font-size: 12px;   fill: #adbac7; }
      .p { font-size: 12px;   fill: #6e7681; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      .bar { transform-origin: 40px 0; animation: grow 1.4s cubic-bezier(.16,1,.3,1) both; }
      @media (prefers-reduced-motion: reduce) { .bar { animation: none } }
    </style>
  </defs>
  <g clip-path="url(#lclip)">
    <rect width="1000" height="150" fill="url(#lpanel)"/>
    <text class="m h" x="40" y="34">LANGUAGE MIX · 25 OWNED REPOS · 2,375,272 BYTES</text>

    <g class="bar" clip-path="url(#barclip)">
      <rect x="40"    y="56" width="455.2" height="22" fill="#3178c6"/>
      <rect x="495.2" y="56" width="139.1" height="22" fill="#dea584"/>
      <rect x="634.3" y="56" width="130.5" height="22" fill="#f1e05a"/>
      <rect x="764.8" y="56" width="71.7"  height="22" fill="#fcb32c"/>
      <rect x="836.5" y="56" width="40.3"  height="22" fill="#3572A5"/>
      <rect x="876.8" y="56" width="28.2"  height="22" fill="#336790"/>
      <rect x="905.0" y="56" width="20.5"  height="22" fill="#e34c26"/>
      <rect x="925.5" y="56" width="19.5"  height="22" fill="#563d7c"/>
      <rect x="945.0" y="56" width="15.1"  height="22" fill="#6e7681"/>
    </g>

    <g class="m">
      <circle cx="46"  cy="106" r="4.5" fill="#3178c6"/><text class="l" x="58"  y="110">TypeScript</text><text class="p" x="148" y="110">49.5%</text>
      <circle cx="206" cy="106" r="4.5" fill="#dea584"/><text class="l" x="218" y="110">Rust</text>      <text class="p" x="266" y="110">15.1%</text>
      <circle cx="324" cy="106" r="4.5" fill="#f1e05a"/><text class="l" x="336" y="110">JavaScript</text><text class="p" x="426" y="110">14.2%</text>
      <circle cx="484" cy="106" r="4.5" fill="#fcb32c"/><text class="l" x="496" y="110">MDX</text>       <text class="p" x="538" y="110">7.8%</text>
      <circle cx="600" cy="106" r="4.5" fill="#3572A5"/><text class="l" x="612" y="110">Python</text>    <text class="p" x="672" y="110">4.4%</text>

      <circle cx="46"  cy="132" r="4.5" fill="#336790"/><text class="l" x="58"  y="136">PLpgSQL</text>   <text class="p" x="130" y="136">3.1%</text>
      <circle cx="206" cy="132" r="4.5" fill="#e34c26"/><text class="l" x="218" y="136">HTML</text>      <text class="p" x="266" y="136">2.2%</text>
      <circle cx="324" cy="132" r="4.5" fill="#563d7c"/><text class="l" x="336" y="136">CSS</text>       <text class="p" x="378" y="136">2.1%</text>
      <circle cx="484" cy="132" r="4.5" fill="#6e7681"/><text class="l" x="496" y="136">Swift · Dart · Ruby · Kotlin · C</text><text class="p" x="726" y="136">1.6%</text>
    </g>
    <rect x="0.5" y="0.5" width="999" height="149" rx="14" fill="none" stroke="#30363d"/>
  </g>
</svg>
